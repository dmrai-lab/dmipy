site_name: "dmipy"
site_description: Diffusion Microstructure Imaging in Python — design the sequence, simulate the signal, fit the tissue
site_url: https://dmipy.org
repo_url: https://github.com/dmrai-lab/dmipy
repo_name: dmrai-lab/dmipy
theme:
  name: material
  font: false            # we load DM Mono + Fraunces ourselves (see extra.css)
  palette:
    scheme: slate
    primary: black
    accent: teal
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.instant
    - toc.integrate
    - content.code.copy
    - search.suggest
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
extra_css:
  - stylesheets/dmrai.css
extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            heading_level: 3
            separate_signature: true
            show_signature_annotations: true
            docstring_section_style: table
            members_order: source
            filters: ["!^_"]
nav:
  - Home: index.md
  - Get started:
      - Install: install.md
      - Your first fit: start/fit.md
      - Your first simulation: start/sim.md
      - Your first designed sequence: start/design.md
  - Acquisition:
      - One object, every engine: acquisition.md
      - RF pulses & timing: rf_pulses.md
      - Scanners & Pulseq: pulseq.md
      - Sequence explorer: studio/explorer.md
  - Simulate:
      - Overview: sim.md
      - Substrate & geometry: substrate.md
      - Mesh substrates: mesh_substrates.md
      - Biophysical constants: constants.md
      - Spin studio: studio/spins.md
      - Replay phantoms:
          - The brain, replayed: phantoms/brain.md
  - Fit:
      - Overview: fit.md
      - Model catalog: catalog.md
  - Design:
      - Overview: design.md
      - Deliverable waveforms: design/deliverable.md
      - OGSE spectral design: design/spectral.md
      - Max-b vs min-TE: design/snr.md
      - B1-robust refocusing RF: design/rf.md
      - Run it on the scanner: design/pulseq.md
  - Physics:
      - Overview: physics/index.md
      - Diffusion: physics/diffusion.md
      - Permeability & exchange: physics/permeability.md
      - Surface relaxivity & MWF: surface_relaxivity_bias.md
      - Coherence gating (PGSTE): physics/coherence_gating.md
      - Susceptibility: physics/susceptibility.md
      - Magnetization transfer: physics/magnetization_transfer.md
      - Analytical vs Monte Carlo: physics/canonical_wm_parity.md
  - Reference:
      - API: api.md
      - Migrating: migrating.md
      - Publications: publications.md
