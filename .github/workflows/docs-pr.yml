name: docs (pull request)
# Builds the site for a pull request and runs every code block on its pages, against the
# engines' git mains (what the staging /dev/ site documents). Nothing is deployed here; see
# docs.yml for the deploy of main (root) and staging (/dev/).
on:
  pull_request:
    paths: ["docs/**", "mkdocs.yml", "tools/**", ".github/workflows/docs*.yml", "pyproject.toml"]
  workflow_dispatch:
env:
  JAX_PLATFORMS: cpu
  MPLBACKEND: Agg
  OMP_NUM_THREADS: "2"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Install the docs toolchain and the engines from their git mains
        run: |
          pip install ".[docs]" "jax[cpu]>=0.6.2" jaxopt matplotlib
          pip install "dmipy-sim @ git+https://github.com/dmrai-lab/dmipy-sim@main" \
                      "dmipy-design @ git+https://github.com/dmrai-lab/dmipy-design@main" \
                      "dmipy-fit @ git+https://github.com/dmrai-lab/dmipy-fit@main"
      - name: Every code block on every page runs
        run: python tools/run_snippets.py
      - name: The sequence explorer's page script runs over its whole grid
        run: node tools/check_explorer.js
      - name: The explorer data is what the installed dmipy-sim builds
        run: |
          python tools/gen_explorer_data.py
          git diff --stat --exit-code docs/studio/explorer_data || {
            echo "explorer_data is stale: run tools/gen_explorer_data.py and commit"; exit 1; }
      - name: The site builds strictly
        run: mkdocs build --strict --site-dir site
